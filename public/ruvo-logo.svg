<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="logoIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161626" />
      <stop offset="50%" stop-color="#0E0E18" />
      <stop offset="100%" stop-color="#08080E" />
    </linearGradient>
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C3C58" />
      <stop offset="50%" stop-color="#242438" />
      <stop offset="100%" stop-color="#181824" />
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="logoStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="logoLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="logoTrajectory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAFF85" />
      <stop offset="50%" stop-color="#C6F432" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="logoNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#C6F432" flood-opacity="0.35" />
    </filter>

    <style>
      .wordmark-char { fill: #0B0B14; }
      .tagline-text { fill: #4B5563; }
      .pill-container { fill: #F3F4F6; stroke: #E5E7EB; }
      .pill-badge { fill: #6B7280; }
      @media (prefers-color-scheme: dark) {
        .wordmark-char { fill: #F4F4FA; }
        .tagline-text { fill: #9CA3AF; }
        .pill-container { fill: #1C1C2B; stroke: #2E2E44; }
        .pill-badge { fill: #C6F432; }
      }
    </style>
  </defs>

  <!-- ================= BRAND ICON SQUIRCLE EMBLEM ================= -->
  <g transform="translate(10, 10)">
    <!-- 100x100 Squircle Container -->
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#logoIconBg)" stroke="url(#logoBorder)" stroke-width="2" />
    
    <!-- Ambient Internal Light -->
    <circle cx="75" cy="25" r="28" fill="#8B5CF6" opacity="0.22" />
    <circle cx="25" cy="75" r="24" fill="#C6F432" opacity="0.14" />

    <!-- Vertical Stem -->
    <rect x="26" y="24" width="12" height="52" rx="4" fill="url(#logoStem)" />

    <!-- Upper Loop -->
    <path d="M38 24H56C66.5 24 75 32.5 75 43C75 53.5 66.5 62 56 62H38V24ZM38 52H55C60 52 64 48 64 43C64 38 60 34 55 34H38V52Z" fill="url(#logoLoop)" />

    <!-- Ascending Trajectory Vector Leg -->
    <path d="M44 54L66 77C67.5 78.5 69.5 79 71.5 79H76C78 79 79 76.5 77.5 75L58 53.5C56.8 52.2 55 51.5 53.2 51.7L47.5 52.2C45.8 52.4 44.2 53.8 44 54Z" fill="url(#logoTrajectory)" filter="url(#logoNeon)" />

    <!-- Foresight Sparkle Star -->
    <polygon points="78,18 80,24 86,26 80,28 78,34 76,28 70,26 76,24" fill="#C6F432" opacity="0.95" />
  </g>

  <!-- ================= VECTOR WORDMARK "RUVO" ================= -->
  <g transform="translate(136, 18)">
    <!-- Letter R -->
    <path class="wordmark-char" d="M0 10C0 4.47715 4.47715 0 10 0H26C38.1503 0 48 9.84974 48 22C48 30.2292 43.4831 37.4043 36.8408 41.1719L48.6016 57.3828C49.897 59.1654 48.6186 61.6875 46.4258 61.6875H35.918C34.4844 61.6875 33.1416 60.9414 32.3672 59.7266L23 45H15V56C15 59.1137 12.4863 61.6875 9.375 61.6875H5.625C2.51371 61.6875 0 59.1137 0 56V10ZM15 13V32H25.5C30.7467 32 35 27.7467 35 22.5C35 17.2533 30.7467 13 25.5 13H15Z" />

    <!-- Letter u -->
    <path class="wordmark-char" d="M64 18C64 15.2386 66.2386 13 69 13H77C79.7614 13 82 15.2386 82 18V42C82 46.4183 85.5817 50 90 50C94.4183 50 98 46.4183 98 42V18C98 15.2386 100.239 13 103 13H111C113.761 13 116 15.2386 116 18V42C116 52.7533 107.287 61.5 96.5 61.5C89.6895 61.5 83.6797 58.0068 80.1777 52.7002C78.8711 58.0449 74.0225 61.5 68.3037 61.5H66C63.2386 61.5 61 59.2614 61 56.5V51.5C61 48.7386 63.2386 46.5 66 46.5H68C71.866 46.5 75 43.366 75 39.5V18C75 15.2386 72.7614 13 70 13H69C66.2386 13 64 15.2386 64 18Z" opacity="0.95" />

    <!-- Letter v -->
    <path class="wordmark-char" d="M132 18C132 15.2386 134.239 13 137 13H142.3C144.787 13 146.91 14.8237 147.32 17.2822L156 69L164.68 17.2822C165.09 14.8237 167.213 13 169.7 13H175C177.761 13 180 15.2386 180 18C180 18.498 179.924 18.9912 179.777 19.4697L167.777 58.4697C166.477 62.7129 162.569 65.75 158 65.75H154C149.431 65.75 145.523 62.7129 144.223 58.4697L132.223 19.4697C132.076 18.9912 132 18.498 132 18Z" opacity="0.95" />

    <!-- Letter o -->
    <path class="wordmark-char" d="M196 37C196 23.7452 206.745 13 220 13C233.255 13 244 23.7452 244 37C244 50.2548 233.255 61 220 61C206.745 61 196 50.2548 196 37ZM210.5 37C210.5 42.2467 214.753 46.5 220 46.5C225.247 46.5 229.5 42.2467 229.5 37C229.5 31.7533 225.247 27.5 220 27.5C214.753 27.5 210.5 31.7533 210.5 37Z" opacity="0.95" />

    <!-- Electric Lime Trajectory Dot -->
    <circle cx="262" cy="51" r="6.5" fill="#C6F432" filter="url(#logoNeon)" />

    <!-- Subtitle Pill Badge -->
    <g transform="translate(2, 74)">
      <rect class="pill-container" x="0" y="0" width="224" height="20" rx="10" stroke-width="1" />
      <text class="pill-badge" x="12" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9.5" letter-spacing="1.6">PERSONAL FINANCE SIMULATOR</text>
    </g>
  </g>
</svg>
