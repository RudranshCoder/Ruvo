<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161626" />
      <stop offset="50%" stop-color="#0E0E18" />
      <stop offset="100%" stop-color="#08080E" />
    </linearGradient>
    <linearGradient id="iconBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C3C58" />
      <stop offset="50%" stop-color="#242438" />
      <stop offset="100%" stop-color="#181824" />
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="trajectoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAFF85" />
      <stop offset="50%" stop-color="#C6F432" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#C6F432" flood-opacity="0.35" />
    </filter>
    <filter id="purpleAura" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#8B5CF6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="8" y="8" width="496" height="496" rx="128" fill="url(#iconBgGrad)" stroke="url(#iconBorderGrad)" stroke-width="3" />

  <!-- Ambient Light Halos -->
  <circle cx="380" cy="120" r="140" fill="#8B5CF6" opacity="0.18" filter="blur(30px)" />
  <circle cx="120" cy="380" r="130" fill="#C6F432" opacity="0.12" filter="blur(30px)" />

  <!-- ================= GEOMETRIC MONOGRAM R ================= -->
  <!-- 1. Vertical Capital Stem (Solid Foundation) -->
  <rect x="136" y="118" width="56" height="276" rx="20" fill="url(#stemGrad)" filter="url(#purpleAura)" />

  <!-- 2. Upper Loop (Enclosed Reserve / Savings Loop) -->
  <path d="M192 118H280C335.228 118 380 162.772 380 218C380 273.228 335.228 318 280 318H192V118ZM192 262H276C300.3 262 320 242.3 320 218C320 193.7 300.3 174 276 174H192V262Z" fill="url(#loopGrad)" />

  <!-- 3. Ascending Vector Leg (Electric Lime Forward Trajectory) -->
  <path d="M224 280L338 402C344 408.5 352.5 412 361.5 412H388C398 412 403 399.5 396 391.5L296 278C290 271.5 281 268 272 269L242 272C233 273 227 281.5 224 280Z" fill="url(#trajectoryGrad)" filter="url(#neonGlow)" />

  <!-- 4. Dynamic Breakout Pulse Arrow Accent -->
  <path d="M302 284L386 388C392 395 401 398 410 398H412C418.5 398 421.5 390 417 385L325 272C319 265 310 262 301 264L295 265C293 265.5 298 279 302 284Z" fill="#D9F96A" opacity="0.9" />

  <!-- 5. Upward Foresight Sparkle Star -->
  <polygon points="396,96 405,124 433,133 405,142 396,170 387,142 359,133 387,124" fill="#C6F432" opacity="0.95" filter="url(#neonGlow)" />
</svg>
